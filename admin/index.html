<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .selected-item {
      background-color: #e9f5ff;
      border-left: 4px solid #0d6efd;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.8);
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner-border text-primary" style="position: absolute; top: 50%; left: 50%"></div>
  </div>

  <div class="container py-4">
    <div id="auth-section" class="card mb-4">
      <div class="card-body">
        <h4 class="mb-3">Admin Login</h4>
        <div class="input-group">
          <input type="password" id="admin-password" class="form-control" placeholder="Password">
          <button id="login-btn" class="btn btn-primary">Login</button>
        </div>
      </div>
    </div>
<!-- Di bawah </div> penutup container -->
<div id="loading" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); justify-content: center; align-items: center; z-index: 9999;">
  <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
</div>
    <div id="admin-panel" style="display: none;">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Kelola Jadwal</h4>
        </div>
        
        <div class="card-body">
          <div class="row">
            <div class="col-md-5">
              <form id="data-form">
                <input type="hidden" id="data-id">
                
                <div class="mb-3">
                  <label>Institusi</label>
                  <select id="institusi" class="form-select" required>
                    <option value="PTIQ">PTIQ</option>
                    <option value="PKU B">PKU B</option>
                    <option value="PKUP">PKUP</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label>Mata Pelajaran</label>
                  <input type="text" id="mapel" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label>Tanggal</label>
                  <input type="date" id="tanggal" class="form-control" 
                         pattern="\d{4}-\d{2}-\d{2}" required>
                </div>

                <div class="mb-3">
                  <label>Peserta</label>
                  <textarea id="peserta" class="form-control" 
                            placeholder="Pisahkan dengan koma" required></textarea>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                  <button type="button" class="btn btn-secondary" onclick="resetForm()">Buat Baru</button>
                </div>
              </form>
            </div>

            <div class="col-md-7">
              <h5>Daftar Jadwal</h5>
              <div id="data-list" class="border rounded p-2" style="max-height: 600px; overflow-y: auto;">
                <!-- Data list akan diisi oleh JS -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
