<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <i class="fas fa-calendar-alt"></i>
                <h1>Jadwal Kuliah</h1>
            </div>
            <button id="themeToggle" class="theme-toggle">
                <span class="theme-icon">
                    <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 3c.2 0 .4.1.5.2.3.2.5.5.5.8 0 .6-.4 1-1 1s-1-.4-1-1c0-.3.2-.6.5-.8.1-.1.3-.2.5-.2zm0 18c-.2 0-.4-.1-.5-.2-.3-.2-.5-.5-.5-.8 0-.6.4-1 1-1s1 .4 1 1c0 .3-.2.6-.5.8-.1.1-.3.2-.5.2zm9-9c0-.2-.1-.4-.2-.5-.2-.3-.5-.5-.8-.5-.6 0-1 .4-1 1s.4 1 1 1c.3 0 .6-.2.8-.5.1-.1.2-.3.2-.5zM3 12c0-.2.1-.4.2-.5.2-.3.5-.5.8-.5.6 0 1 .4 1 1s-.4 1-1 1c-.3 0-.6-.2-.8-.5-.1-.1-.2-.3-.2-.5zm14.9-5.1c.2.2.5.3.7.3s.5-.1.7-.3c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4zM6.3 17.7c.2.2.5.3.7.3s.5-.1.7-.3c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4zm11.4 0l1.4 1.4c.4.4 1 .4 1.4 0s.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4zM6.3 6.3L4.9 4.9c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4c.4.4 1 .4 1.4 0s.4-1 0-1.4z"/>
                    </svg>
                    <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10v4m0 4h.01M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3l1.4 1.4M2 12h2m16 0h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
                    </svg>
                </span>
            </button>
        </div>
        
        <div class="header-bottom">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari jadwal...">
                <i class="fas fa-search"></i>
            </div>
            <nav class="filter-nav" id="filterNav"></nav>
        </div>
    </header>

    <main class="main-content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <div class="schedule-grid" id="scheduleGrid"></div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-calendar-times"></i>
            <h3>Jadwal tidak ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <!-- Participant Modal -->
    <div class="participant-modal" id="participantModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <div class="modal-schedules" id="modalSchedules"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
