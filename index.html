<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Theme Transition</title>
    <style>
        :root {
            --light-color: #ffffff;
            --dark-color: #1a1a1a;
            --primary-color: #6D9F71;
            --ripple-duration: 0.8s;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            transition: background-color 0.01s; /* Hanya untuk inisialisasi */
            position: relative;
            overflow: hidden;
        }

        .theme-ripple {
            position: absolute;
            width: 100vmax;
            height: 100vmax;
            background: var(--dark-color);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            mix-blend-mode: difference;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .theme-toggle i {
            color: white;
            font-size: 1.2rem;
            transition: transform var(--ripple-duration) ease;
        }

        /* Animasi */
        @keyframes ripple-dark {
            to {
                transform: translate(-50%, -50%) scale(4);
                opacity: 1;
            }
        }

        @keyframes ripple-light {
            to {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body data-theme="light">
    <button class="theme-toggle" id="toggleBtn">
        <i class="fas fa-moon"></i>
    </button>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        let currentTheme = localStorage.getItem('theme') || 'light';
        
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'theme-ripple';
            
            // Set posisi berdasarkan klik
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            // Tentukan animasi berdasarkan tema
            if(currentTheme === 'light') {
                ripple.style.background = var(--dark-color);
                ripple.style.animation = `ripple-dark ${var(--ripple-duration)} ease-out forwards`;
                document.body.dataset.theme = 'dark';
            } else {
                ripple.style.background = var(--light-color);
                ripple.style.animation = `ripple-light ${var(--ripple-duration)} ease-out forwards`;
                document.body.dataset.theme = 'light';
            }
            
            document.body.appendChild(ripple);
            
            // Hapus ripple setelah animasi
            setTimeout(() => ripple.remove(), var(--ripple-duration) * 1000);
        }

        function toggleTheme(e) {
            const rect = toggleBtn.getBoundingClientRect();
            const x = rect.left + rect.width/2;
            const y = rect.top + rect.height/2;
            
            createRipple(x, y);
            
            // Update state dan local storage
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            
            // Update icon
            toggleBtn.querySelector('i').className = currentTheme === 'dark' 
                ? 'fas fa-sun' 
                : 'fas fa-moon';
        }

        // Inisialisasi
        if(currentTheme === 'dark') {
            document.body.style.backgroundColor = var(--dark-color);
            toggleBtn.querySelector('i').className = 'fas fa-sun';
        }
        
        toggleBtn.addEventListener('click', toggleTheme);
    </script>
</body>
</html>
