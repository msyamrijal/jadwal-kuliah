<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #4f46e5;
            --background: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            background: var(--background);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .schedule-card {
            background: var(--card-bg);
            border: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .schedule-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .schedule-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary) !important;
            color: white !important;
        }

        .participant-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 9999;
            display: none;
        }

        .skeleton-loader {
            animation: pulse 1.5s infinite;
            background: #e5e7eb;
            border-radius: 8px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1 }
            50% { opacity: 0.5 }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-calendar-alt me-2"></i>
                JADWAL KULIAH INTERAKTIF
            </a>
            <button class="btn btn-outline-light" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-3 mb-4">
            <div class="col-12 col-lg-4">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control form-control-lg" 
                           placeholder="Cari jadwal...">
                    <button class="btn btn-primary">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            
            <div class="col-12 col-lg-8">
                <div class="d-flex flex-wrap gap-2" id="filterContainer">
                    <button class="btn btn-outline-primary filter-btn" data-filter="all">Semua</button>
                </div>
            </div>
        </div>

        <div id="loading" class="d-flex justify-content-center align-items-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        </div>

        <div id="scheduleGrid" class="row g-4"></div>

        <div id="noResults" class="text-center py-5 d-none">
            <div class="display-1 text-muted mb-3">
                <i class="fas fa-calendar-times"></i>
            </div>
            <h3 class="text-muted">Tidak ada jadwal yang ditemukan</h3>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detail Jadwal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby9sPywic_2ifeYBzE3dQMHfrwkR4-fQv-bNx74HMduvcq5Rr4r9MY6GGEYNqI44WRI/exec';
        let allData = [];
        let currentFilters = {
            search: '',
            institution: 'all'
        };

        // Load initial data
        async function init() {
            showLoading();
            try {
                const response = await fetch(API_URL);
                allData = await response.json();
                initFilters();
                renderData(allData);
            } catch (error) {
                console.error('Error:', error);
            } finally {
                hideLoading();
            }
        }

        // Initialize filters
        function initFilters() {
            const filterContainer = document.getElementById('filterContainer');
            const institutions = [...new Set(allData.map(item => item.Institusi))];
            
            institutions.forEach(inst => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-primary filter-btn';
                btn.textContent = inst;
                btn.dataset.filter = inst;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilters.institution = inst;
                    filterData();
                });
                filterContainer.appendChild(btn);
            });
        }

        // Filter data
        function filterData() {
            const searchTerm = currentFilters.search.toLowerCase();
            const filtered = allData.filter(item => {
                const matchesSearch = [
                    item.Institusi,
                    item.Mata_Pelajaran,
                    item.Tanggal,
                    item.Peserta.join(' ')
                ].some(text => text.toLowerCase().includes(searchTerm));

                const matchesInstitution = currentFilters.institution === 'all' || 
                    item.Institusi === currentFilters.institution;

                return matchesSearch && matchesInstitution;
            });

            renderData(filtered);
        }

        // Render data
        function renderData(data) {
            const container = document.getElementById('scheduleGrid');
            const noResults = document.getElementById('noResults');
            
            container.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('d-none');
                return;
            }
            
            noResults.classList.add('d-none');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="schedule-card p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge bg-primary rounded-pill">${item.Institusi}</span>
                            <small class="text-muted">${formatDate(item.Tanggal)}</small>
                        </div>
                        <h5 class="mb-3 fw-bold">${item.Mata_Pelajaran}</h5>
                        <div class="participants d-flex flex-wrap gap-2">
                            ${item.Peserta.slice(0, 4).map((p, i) => `
                                <div class="participant-avatar" ${i === 3 && item.Peserta.length > 4 ? 
                                    `title="${item.Peserta.slice(3).join(', ')}"` : ''}>
                                    ${i === 3 && item.Peserta.length > 4 ? 
                                        `+${item.Peserta.length - 3}` : p.split(' ')[0].charAt(0)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => showDetailModal(item));
                container.appendChild(card);
            });
        }

        // Show detail modal
        function showDetailModal(item) {
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="mb-3">
                    <h4>${item.Mata_Pelajaran}</h4>
                    <div class="text-muted">${item.Institusi}</div>
                    <div class="text-muted">${formatDate(item.Tanggal, true)}</div>
                </div>
                <div class="participants-list">
                    <h6>Peserta:</h6>
                    <ul class="list-group">
                        ${item.Peserta.map(p => `
                            <li class="list-group-item d-flex align-items-center">
                                <div class="participant-avatar me-2">
                                    ${p.split(' ')[0].charAt(0)}
                                </div>
                                ${p}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            
            new bootstrap.Modal(document.getElementById('detailModal')).show();
        }

        // Utility functions
        function formatDate(dateString, withTime = false) {
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                ...(withTime && { hour: '2-digit', minute: '2-digit' })
            });
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilters.search = e.target.value;
            filterData();
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            document.body.style.setProperty('--background', 
                document.body.classList.contains('dark-theme') ? '#1e293b' : '#f8fafc');
            document.body.style.setProperty('--card-bg', 
                document.body.classList.contains('dark-theme') ? '#334155' : '#ffffff');
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
