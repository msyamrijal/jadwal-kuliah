<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple Theme Transition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --light-bg: #ffffff;
            --dark-bg: #1a1a1a;
            --primary-color: #6D9F71;
            --ripple-duration: 0.8s;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
            background: var(--light-bg);
            color: #333;
            transition: background-color 0.01s;
        }

        body.dark {
            background-color: var(--dark-bg);
            color: #fff;
        }

        .theme-ripple {
            position: absolute;
            width: 100vmax;
            height: 100vmax;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: ripple var(--ripple-duration) ease-out;
        }

        .dark .theme-ripple {
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes ripple {
            to {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .theme-toggle i {
            color: white;
            font-size: 1.2rem;
            transition: transform var(--ripple-duration) ease;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="toggleBtn">
        <i class="fas fa-moon"></i>
    </button>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        let isDark = localStorage.getItem('theme') === 'dark';
        
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'theme-ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            document.body.appendChild(ripple);
            
            // Hapus ripple setelah animasi selesai
            setTimeout(() => ripple.remove(), 800);
        }

        function toggleTheme(e) {
            // Dapatkan posisi tombol
            const rect = toggleBtn.getBoundingClientRect();
            const x = rect.left + rect.width/2;
            const y = rect.top + rect.height/2;
            
            // Buat efek ripple
            createRipple(x, y);
            
            // Toggle tema
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            // Update icon
            const icon = toggleBtn.querySelector('i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            
            // Animasi rotasi icon
            icon.style.transform = `rotate(${isDark ? 180 : 0}deg)`;
        }

        // Inisialisasi tema
        if(isDark) {
            document.body.classList.add('dark');
            toggleBtn.querySelector('i').className = 'fas fa-sun';
        }

        toggleBtn.addEventListener('click', toggleTheme);
    </script>
</body>
</html>
