<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Overlay untuk efek transisi tema -->
    <div class="theme-overlay" id="themeOverlay"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <i class="fas fa-calendar-alt"></i>
                <h1>Jadwal Kuliah</h1>
            </div>
            <button id="themeToggle" class="theme-toggle">
                <span class="theme-icon"></span>
            </button>
        </div>
        
        <div class="header-bottom">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari jadwal...">
                <i class="fas fa-search"></i>
            </div>
            <nav class="filter-nav" id="filterNav"></nav>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="main-content">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <!-- Grid Jadwal -->
        <div class="schedule-grid" id="scheduleGrid"></div>

        <!-- Tampilan Kosong -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-calendar-times"></i>
            <h3>Jadwal tidak ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <!-- Modal Partisipan -->
    <div class="participant-modal" id="participantModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <div class="modal-schedules" id="modalSchedules"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
