<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-2v2h2v2h-4v-2h-2v4h6v-6zm-8-2H7v-2h2V7h4v2h2v2h-2v2h-2v-2z"/>
                </svg>
                <h1>Jadwal Kuliah</h1>
            </div>
            <button id="themeToggle" class="theme-toggle">
                <span class="theme-icon">
                    <svg class="sun" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10v4m0 4h.01M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3l1.4 1.4M2 12h2m16 0h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
                    </svg>
                    <svg class="moon" viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M12 3c.2 0 .4.1.5.2.3.2.5.5.5.8 0 .6-.4 1-1 1s-1-.4-1-1c0-.3.2-.6.5-.8.1-.1.3-.2.5-.2zm0 18c-.2 0-.4-.1-.5-.2-.3-.2-.5-.5-.5-.8 0-.6.4-1 1-1s1 .4 1 1c0 .3-.2.6-.5.8-.1.1-.3.2-.5.2zm9-9c0-.2-.1-.4-.2-.5-.2-.3-.5-.5-.8-.5-.6 0-1 .4-1 1s.4 1 1 1c.3 0 .6-.2.8-.5.1-.1.2-.3.2-.5zM3 12c0-.2.1-.4.2-.5.2-.3.5-.5.8-.5.6 0 1 .4 1 1s-.4 1-1 1c-.3 0-.6-.2-.8-.5-.1-.1-.2-.3-.2-.5zm14.9-5.1c.2.2.5.3.7.3s.5-.1.7-.3c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4zM6.3 17.7c.2.2.5.3.7.3s.5-.1.7-.3c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4zm11.4 0l1.4 1.4c.4.4 1 .4 1.4 0s.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4zM6.3 6.3L4.9 4.9c-.4-.4-1-.4-1.4 0s-.4 1 0 1.4l1.4 1.4c.4.4 1 .4 1.4 0s.4-1 0-1.4z"/>
                    </svg>
                </span>
            </button>
        </div>
        
        <div class="header-bottom">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Cari jadwal...">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <nav class="filter-nav" id="filterNav"></nav>
        </div>
    </header>

    <main class="main-content">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <div class="schedule-grid" id="scheduleGrid"></div>

        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" width="48" height="48">
                <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-8-3h2v2h-2zm1-8c1.1 0 2 .9 2 2 0 1.1-.9 2-2 2s-2-.9-2-2c0-1.1.9-2 2-2z"/>
            </svg>
            <h3>Jadwal tidak ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <!-- Participant Modal -->
    <div class="participant-modal" id="participantModal">
        <div class="modal-content">
            <span class="close-modal">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </span>
            <h3 id="modalTitle"></h3>
            <div class="modal-schedules" id="modalSchedules"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
