<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah | PTIQ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="brand" href="#">
                <i class="fas fa-calendar-alt"></i>
                <span>Jadwal Kuliah</span>
            </a>
            <div class="nav-controls">
                <button id="themeToggle" class="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/admin" class="admin-btn">
                    <i class="fas fa-lock"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari jadwal...">
                <i class="fas fa-search"></i>
            </div>
            <div id="filterButtons" class="filter-buttons"></div>
        </div>

        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Memuat Jadwal...</p>
        </div>

        <div id="jadwal-container" class="grid-container"></div>

        <div id="no-results" class="empty-state">
            <i class="fas fa-calendar-times"></i>
            <h3>Jadwal Tidak Ditemukan</h3>
            <p>Coba kata kunci atau filter berbeda</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
