<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Terkini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gradient-1: #0f0c29;
            --gradient-2: #302b63;
            --accent-color: #00c6ff;
        }

        body {
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
        }

        .schedule-badge {
            background: linear-gradient(45deg, var(--accent-color), #00a8ff);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 0.9em;
        }

        .participant-chip {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 5px 12px;
            margin: 4px;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s ease;
        }

        #searchInput {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            border-radius: 25px;
            padding: 14px 25px;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: none;
        }

        .timeline-marker {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            margin-right: 10px;
        }

        .countdown-badge {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-calendar-alt me-2"></i>
                <span class="fw-bold">Jadwal Terkini</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/admin" class="btn btn-outline-light">
                    <i class="fas fa-lock me-2"></i>Admin
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-lg-8 mx-auto">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" 
                           placeholder="Cari jadwal, mata kuliah, atau peserta...">
                    <button class="btn btn-outline-light" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4" id="filterButtons"></div>

        <div id="loading" class="text-center my-5 py-5">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Memuat...</span>
            </div>
            <p class="mt-3 text-muted">Sedang memuat jadwal terbaru...</p>
        </div>

        <div id="jadwal-container" class="row g-4"></div>

        <div id="no-results" class="text-center py-5 d-none">
            <div class="glass-card p-5">
                <i class="fas fa-calendar-times fa-4x mb-3 text-muted"></i>
                <h3 class="mb-2">Tidak ada jadwal</h3>
                <p class="text-muted">Tidak ditemukan jadwal yang akan datang</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby9sPywic_2ifeYBzE3dQMHfrwkR4-fQv-bNx74HMduvcq5Rr4r9MY6GGEYNqI44WRI/exec';
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const rawData = await response.json();
                const today = new Date();
                today.setHours(0,0,0,0);

                // Filter dan sort data
                allData = rawData
                    .filter(item => {
                        const itemDate = new Date(item.Tanggal);
                        itemDate.setHours(0,0,0,0);
                        return itemDate >= today;
                    })
                    .sort((a, b) => new Date(a.Tanggal) - new Date(b.Tanggal));

                initFilters();
                renderData(allData);
            } catch (error) {
                console.error("Gagal memuat data:", error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function initFilters() {
            const institutions = [...new Set(allData.map(item => item.Institusi))];
            const filterContainer = document.getElementById('filterButtons');
            
            filterContainer.innerHTML = `
                <div class="col-auto">
                    <button class="btn btn-outline-light active" data-filter="all">
                        Semua Institusi
                    </button>
                </div>
                ${institutions.map(inst => `
                    <div class="col-auto">
                        <button class="btn btn-outline-light" data-filter="${inst}">
                            ${inst}
                        </button>
                    </div>
                `).join('')}
            `;

            document.querySelectorAll('#filterButtons button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#filterButtons button').forEach(b => 
                        b.classList.remove('active'));
                    this.classList.add('active');
                    filterData();
                });
            });
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeFilter = document.querySelector('#filterButtons .active').dataset.filter;
            
            const filtered = allData.filter(item => {
                const matchesSearch = [
                    item.Institusi,
                    item.Mata_Pelajaran,
                    item.Tanggal,
                    item.Peserta.join(' ')
                ].some(text => text.toLowerCase().includes(searchTerm));
                
                const matchesFilter = activeFilter === 'all' ? 
                    true : 
                    item.Institusi === activeFilter;
                
                return matchesSearch && matchesFilter;
            });

            renderData(filtered);
        }

        function renderData(data) {
            const container = document.getElementById('jadwal-container');
            const noResults = document.getElementById('no-results');
            const today = new Date();
            today.setHours(0,0,0,0);

            container.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('d-none');
                return;
            }
            
            noResults.classList.add('d-none');

            data.forEach(item => {
                const itemDate = new Date(item.Tanggal);
                const diffDays = Math.floor((itemDate - today) / (1000 * 60 * 60 * 24));
                
                const card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="glass-card h-100 p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="schedule-badge">${item.Institusi}</span>
                            <div class="d-flex align-items-center gap-2">
                                ${diffDays === 0 ? 
                                    '<span class="badge bg-danger">HARI INI</span>' : 
                                    `<span class="countdown-badge badge">
                                        ${getCountdownText(itemDate)}
                                    </span>`
                                }
                            </div>
                        </div>
                        
                        <h4 class="mb-3 flex-grow-1">${item.Mata_Pelajaran}</h4>
                        
                        <div class="d-flex align-items-center mb-3 text-muted">
                            <div class="timeline-marker"></div>
                            <small>${formatDate(item.Tanggal)}</small>
                        </div>
                        
                        <div class="participants mb-3">
                            ${item.Peserta.map(peserta => `
                                <span class="participant-chip">
                                    <i class="fas fa-user me-2"></i>
                                    ${peserta}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long',
                year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
            };
            
            return date.toLocaleDateString('id-ID', options).replace(/\,$/, '');
        }

        function getCountdownText(targetDate) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const diffDays = Math.floor((targetDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Hari Ini';
            if (diffDays === 1) return 'Besok';
            if (diffDays <= 7) return `${diffDays} Hari Lagi`;
            return `${Math.ceil(diffDays/7)} Minggu Lagi`;
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
