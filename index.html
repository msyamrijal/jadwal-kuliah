<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Interaktif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gradient-1: #6a11cb;
            --gradient-2: #2575fc;
            --accent-color: #ff6b6b;
        }

        body {
            background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .schedule-badge {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 15px;
        }

        .participant-chip {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 5px 10px;
            margin: 3px;
            display: inline-block;
        }

        #searchInput {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 25px;
            padding: 15px 25px;
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent py-3">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-calendar-alt me-2"></i>
                <span class="fw-bold">Jadwal Kuliah</span>
            </a>
            <div class="d-flex align-items-center">
                <a href="jadwal-kuliah/admin" class="btn btn-outline-light">
                    <i class="fas fa-lock me-2"></i>Admin
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" 
                           placeholder="Cari jadwal, mata kuliah, atau peserta...">
                    <button class="btn btn-outline-light" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row g-4" id="filterButtons"></div>

        <div id="loading" class="text-center my-5 py-5">
            <i class="fas fa-circle-notch fa-spin fa-3x loading-spinner"></i>
            <p class="mt-3">Memuat jadwal...</p>
        </div>

        <div id="jadwal-container" class="row g-4"></div>

        <div id="no-results" class="text-center py-5 d-none">
            <i class="fas fa-calendar-times fa-4x mb-3"></i>
            <h3>Jadwal tidak ditemukan</h3>
            <p class="text-muted">Coba gunakan kata kunci lain atau filter berbeda</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycby9sPywic_2ifeYBzE3dQMHfrwkR4-fQv-bNx74HMduvcq5Rr4r9MY6GGEYNqI44WRI/exec';
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                allData = await response.json();
                initFilters();
                renderData(allData);
            } catch (error) {
                console.error("Gagal memuat data:", error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function initFilters() {
            const institutions = [...new Set(allData.map(item => item.Institusi))];
            const filterButtons = document.getElementById('filterButtons');
            
            filterButtons.innerHTML = `
                <div class="col-auto">
                    <button class="btn btn-outline-light active" 
                            data-filter="all">Semua</button>
                </div>
                ${institutions.map(inst => `
                    <div class="col-auto">
                        <button class="btn btn-outline-light" 
                                data-filter="institusi:${inst}">${inst}</button>
                    </div>
                `).join('')}
            `;

            document.querySelectorAll('#filterButtons button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#filterButtons button').forEach(b => 
                        b.classList.remove('active'));
                    btn.classList.add('active');
                    filterData();
                });
            });
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeFilter = document.querySelector('#filterButtons .active').dataset.filter;
            
            let filtered = allData.filter(item => {
                const matchesSearch = [
                    item.Institusi,
                    item.Mata_Pelajaran,
                    item.Tanggal,
                    item.Peserta.join(' ')
                ].some(text => text.toLowerCase().includes(searchTerm));
                
                const matchesFilter = activeFilter === 'all' ? true : 
                    activeFilter.split(':')[1] === item.Institusi;
                
                return matchesSearch && matchesFilter;
            });

            renderData(filtered);
        }

        function renderData(data) {
            const container = document.getElementById('jadwal-container');
            const noResults = document.getElementById('no-results');
            
            container.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('d-none');
                return;
            }
            
            noResults.classList.add('d-none');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="glass-card h-100 p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="schedule-badge">${item.Institusi}</span>
                            <small>${new Date(item.Tanggal).toLocaleDateString('id-ID', {
                                weekday: 'long', 
                                day: 'numeric', 
                                month: 'long'
                            })}</small>
                        </div>
                        <h4 class="mb-3">${item.Mata_Pelajaran}</h4>
                        <div class="participants mb-3">
                            ${item.Peserta.map(peserta => `
                                <span class="participant-chip">
                                    <i class="fas fa-user me-2"></i>${peserta}
                                </span>
                            `).join('')}
                        </div>
                        <div class="text-end">
                            <button class="btn btn-sm btn-outline-light" 
                                    onclick="shareSchedule('${item.Mata_Pelajaran}', '${item.Tanggal}')">
                                <i class="fas fa-share"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function shareSchedule(title, date) {
            const text = `Jadwal ${title} pada ${date}`;
            if (navigator.share) {
                navigator.share({
                    title: 'Bagikan Jadwal',
                    text: text,
                });
            } else {
                prompt('Salin tautan berikut:', window.location.href);
            }
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
